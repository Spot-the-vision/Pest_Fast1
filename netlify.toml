[build]
  command = "node build-single.mjs"
  publish = "dist"

[[redirects]]
  from = "/worker/*"
  to = "/worker/index.html"
  status = 200

[[redirects]]
  from = "/agency/*"
  to = "/agency/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
